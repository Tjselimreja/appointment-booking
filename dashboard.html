<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Appointments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  :root {
    --ink: #1B2A2E;
    --muted: #5B6B66;
    --paper: #F5F6F4;
    --paper-alt: #ECEFEC;
    --line: #CBD3CF;
    --accent: #2F6D5E;
    --accent-dark: #204A40;
    --danger: #9C3B2C;
    --warning: #9C6B14;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    font-family: 'Hind Siliguri', 'Segoe UI', sans-serif;
    color: var(--ink);
  }
  .hidden { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .wide-sheet { animation: none !important; }
  }

  /* ---- Auth ---- */
  .sheet {
    max-width: 380px;
    margin: 64px auto;
    padding: 40px 32px 32px;
    background: #fff;
    border: 1px solid var(--line);
    animation: fadeUp 0.4s ease both;
  }
  @keyframes fadeUp { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
  .sheet h2 {
    font-family: 'Tiro Bangla', serif;
    font-weight: 400;
    font-size: 26px;
    margin: 0 0 24px;
    text-align: left;
  }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    border: none;
    border-bottom: 1.5px solid var(--line);
    background: transparent;
    padding: 9px 2px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }
  .field input:focus { border-bottom-color: var(--accent); }
  .submit-btn {
    width: 100%;
    padding: 13px;
    margin-top: 6px;
    background: var(--ink);
    color: #fff;
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .submit-btn:hover { background: var(--accent-dark); }
  .toggle-auth {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    margin-top: 16px;
  }
  .toggle-auth span { color: var(--accent-dark); border-bottom: 1px solid var(--accent-dark); }

  /* ---- Dashboard ---- */
  .wide-sheet {
    max-width: 900px;
    margin: 40px auto;
    padding: 36px 32px 40px;
    background: #fff;
    border: 1px solid var(--line);
    animation: fadeUp 0.4s ease both;
  }
  @media (max-width: 620px) {
    .wide-sheet, .sheet { margin: 0; border: none; padding: 28px 18px; }
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .header h2 {
    font-family: 'Tiro Bangla', serif;
    font-weight: 400;
    font-size: 28px;
    margin: 0;
  }
  .btn-outline {
    padding: 9px 18px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .btn-outline:hover { border-color: var(--ink); color: var(--ink); }

  .share-box {
    border: 1px solid var(--line);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .share-box .label {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
  }
  .share-box input {
    flex: 1;
    min-width: 180px;
    border: none;
    border-bottom: 1.5px solid var(--line);
    background: transparent;
    padding: 6px 2px;
    font-size: 14px;
    color: var(--ink);
    font-family: inherit;
  }
  .btn-copy {
    padding: 9px 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn-copy:hover { background: var(--accent-dark); }

  .section-title {
    font-family: 'Tiro Bangla', serif;
    font-size: 19px;
    font-weight: 400;
    border-bottom: 1px solid var(--line);
    padding-bottom: 9px;
    margin-bottom: 16px;
  }

  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td {
    padding: 13px 10px;
    text-align: left;
    font-size: 14px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  th {
    font-weight: 600;
    color: var(--muted);
    font-size: 13px;
    border-bottom: 1.5px solid var(--ink);
  }
  td small { color: var(--muted); }

  .status-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
  .status-pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .status-pending::before { background: var(--warning); }
  .status-confirmed::before { background: var(--accent); }
  .status-rejected::before { background: var(--danger); }
  .status-pending { color: var(--warning); }
  .status-confirmed { color: var(--accent-dark); }
  .status-rejected { color: var(--danger); }

  .btn-action {
    padding: 6px 12px;
    margin-right: 6px;
    font-size: 12px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: transparent;
    font-family: inherit;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .btn-confirm { color: var(--accent-dark); }
  .btn-confirm:hover { border-color: var(--accent-dark); }
  .btn-reject { color: var(--danger); }
  .btn-reject:hover { border-color: var(--danger); }
</style>
</head>
<body>

  <!-- Auth Section -->
  <div id="authSection" class="sheet">
    <h2 id="authTitle">User Login</h2>
    <form id="authForm">
      <div class="field">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" required>
      </div>
      <div class="field">
        <label for="authPassword">Password</label>
        <input type="password" id="authPassword" required>
      </div>
      <button type="submit" id="authBtn" class="submit-btn">Login</button>
    </form>
    <div class="toggle-auth" id="toggleAuth">Don't have an account? <span>Sign Up</span></div>
  </div>

  <!-- Dashboard Section -->
  <div id="dashboardSection" class="wide-sheet hidden">
    <div class="header">
      <h2>Appointment Management</h2>
      <button id="logoutBtn" class="btn-outline">Logout</button>
    </div>

    <div class="share-box">
      <span class="label">Your Booking Link</span>
      <input type="text" id="shareLinkInput" readonly>
      <button class="btn-copy" onclick="copyLink()">Copy Link</button>
    </div>

    <div>
      <div class="section-title">Your Appointments</div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Visitor Name</th>
              <th>Contact</th>
              <th>Purpose</th>
              <th>Date & Time</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="appointmentList">
            <tr><td colspan="6" style="text-align: center;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xybimiabjmfawxkrscvu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Kqv8UFQAOLFgyyTbowLvWQ_9lUZ-3zX';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isSignUp = false;
    let currentUser = null;

    const authSection = document.getElementById('authSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const toggleAuth = document.getElementById('toggleAuth');

    toggleAuth.addEventListener('click', () => {
      isSignUp = !isSignUp;
      document.getElementById('authTitle').innerText = isSignUp ? 'Create New Account' : 'User Login';
      document.getElementById('authBtn').innerText = isSignUp ? 'Sign Up' : 'Login';
      toggleAuth.innerHTML = isSignUp
        ? 'Already have an account? <span>Login</span>'
        : "Don't have an account? <span>Sign Up</span>";
    });

    async function checkUser() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentUser = session.user;
        showDashboard();
      }
    }
    checkUser();

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;

      try {
        if (isSignUp) {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) throw error;

          Swal.fire({
            title: 'Account Created!',
            text: 'You can now log in to your account.',
            icon: 'success',
            confirmButtonColor: '#2F6D5E'
          }).then(() => {
            location.reload();
          });
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          currentUser = data.user;
          showDashboard();
        }
      } catch (error) {
        Swal.fire({
          title: 'Error!',
          text: error.message,
          icon: 'error',
          confirmButtonColor: '#9C3B2C'
        });
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      location.reload();
    });

    function showDashboard() {
      authSection.classList.add('hidden');
      dashboardSection.classList.remove('hidden');

      const baseUrl = window.location.origin + window.location.pathname.replace('dashboard.html', 'index.html');
      const bookingUrl = `${baseUrl}?host=${currentUser.id}`;
      document.getElementById('shareLinkInput').value = bookingUrl;

      fetchAppointments();
    }

    function copyLink() {
      const linkInput = document.getElementById('shareLinkInput');
      linkInput.select();
      navigator.clipboard.writeText(linkInput.value);

      Swal.fire({
        toast: true,
        position: 'top-end',
        icon: 'success',
        title: 'Booking link copied to clipboard!',
        showConfirmButton: false,
        timer: 2000
      });
    }

    const statusLabel = { pending: 'Pending', confirmed: 'Confirmed', rejected: 'Rejected' };

    async function fetchAppointments() {
      const { data, error } = await supabaseClient
        .from('appointments')
        .select('*')
        .eq('host_id', currentUser.id)
        .order('created_at', { ascending: false });

      if (error) {
        Swal.fire('Error!', error.message, 'error');
        return;
      }

      const tbody = document.getElementById('appointmentList');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--muted);">No appointments found for your account.</td></tr>';
        return;
      }

      data.forEach(item => {
        const tr = document.createElement('tr');
        const label = statusLabel[item.status] || item.status;
        tr.innerHTML = `
          <td><strong>${item.visitor_name}</strong></td>
          <td>${item.visitor_email}<br><small>${item.visitor_phone}</small></td>
          <td>${item.meeting_purpose}</td>
          <td>${item.appointment_date}<br><small>${item.start_time} - ${item.end_time}</small></td>
          <td><span class="status-pill status-${item.status}">${label}</span></td>
          <td>
            <button class="btn-action btn-confirm" onclick="updateStatus('${item.id}', 'confirmed')">Confirm</button>
            <button class="btn-action btn-reject" onclick="updateStatus('${item.id}', 'rejected')">Reject</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function updateStatus(id, newStatus) {
      const { error } = await supabaseClient
        .from('appointments')
        .update({ status: newStatus })
        .eq('id', id);

      if (error) {
        Swal.fire('Update Failed', error.message, 'error');
      } else {
        Swal.fire({
          toast: true,
          position: 'top-end',
          icon: 'success',
          title: `Appointment ${newStatus}!`,
          showConfirmButton: false,
          timer: 1500
        });
        fetchAppointments();
      }
    }
  </script>
</body>
</html>
